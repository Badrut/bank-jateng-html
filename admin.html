<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Jateng Syariah - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/admin.css">
    <style>
        /* Variabel warna kustom untuk tema */
        :root {
            --admin-primary-dark: #001f3f;
            /* Dark Blue - mirip sidebar sebelumnya */
            --admin-primary-light: #047857;
            /* Dark Emerald Green - dari tema Anda */
            --admin-accent-gold: #F59E0B;
            /* Golden Yellow - dari tema Anda */
            --admin-text-light: #e2e8f0;
            /* Light Gray for text on dark bg */
            --admin-bg-light: #f8fafc;
            /* Very light background for content area */
            --admin-surface-white: #ffffff;
            --admin-border-light: #e2e8f0;
            --admin-text-dark: #1e293b;
            --admin-text-secondary: #64748b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--admin-bg-light);
            color: var(--admin-text-dark);
        }

        /* Gaya tambahan untuk kelas khusus */
        .sidebar {
            background-color: var(--admin-primary-dark);
            width: 250px;
            transition: width 0.3s ease-in-out;
            flex-shrink: 0;
            height: 100vh;
            /* Full height */
            position: fixed;
            /* Fix sidebar position */
            top: 0;
            left: 0;
            z-index: 1000;
            overflow-y: auto;
            /* Enable scrolling for long content */
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .main-content {
            margin-left: 250px;
            /* Space for sidebar */
            transition: margin-left 0.3s ease-in-out;
            flex-grow: 1;
        }

        .main-content.sidebar-collapsed {
            margin-left: 80px;
        }

        /* Custom scrollbar for sidebar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 1023px) {
            .sidebar {
                left: -250px;
                /* Hide sidebar by default on mobile */
                width: 250px;
                /* Full width when active */
                box-shadow: none;
            }

            .sidebar.active-mobile {
                left: 0;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
            }

            .main-content {
                margin-left: 0;
                /* No margin on mobile */
            }

            .navbar-toggle-mobile {
                display: block;
                /* Show hamburger menu on mobile */
            }
        }
    </style>
</head>

<body class="flex min-h-screen">

    <aside id="sidebar" class="sidebar">
        <div
            class="sidebar-header p-6 flex items-center justify-center text-white text-2xl font-extrabold border-b border-white/[0.05]">
            <i class="fas fa-money-check-alt text-[var(--admin-accent-gold)] mr-3 sidebar-icon"></i>
            <span class="sidebar-text">Admin Panel</span>
        </div>

        <nav class="sidebar-nav mt-8">
            <ul>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200 active-menu"
                        data-page="dashboard">
                        <i class="fas fa-tachometer-alt text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="nasabah">
                        <i class="fas fa-users text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Manajemen Nasabah</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="rekening">
                        <i class="fas fa-university text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Manajemen Rekening</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="pembiayaan">
                        <i class="fas fa-hand-holding-usd text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Manajemen Pembiayaan</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="investasi">
                        <i class="fas fa-chart-line text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Manajemen Investasi</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="transaksi">
                        <i class="fas fa-exchange-alt text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Riwayat Transaksi</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="nisbah">
                        <i class="fas fa-percent text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Nisbah & Bagi Hasil</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="notifikasi">
                        <i class="fas fa-bell text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Notifikasi & Pesan</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="zakat-infaq">
                        <i class="fas fa-hand-holding-heart text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Zakat & Infaq</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="users-management">
                        <i class="fas fa-user-shield text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Manajemen Pengguna</span>
                    </a>
                </li>
                <li>
                    <a href="#"
                        class="flex items-center text-[var(--admin-text-light)] py-3 px-6 rounded-r-full hover:bg-white/[0.1] transition-all duration-200"
                        data-page="settings">
                        <i class="fas fa-cogs text-lg mr-4 sidebar-icon"></i>
                        <span class="sidebar-text">Pengaturan</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <div id="main-content" class="main-content flex flex-col w-full">
        <header
            class="bg-white shadow-sm py-4 px-6 sm:px-8 flex items-center justify-between border-b border-[var(--admin-border-light)] sticky top-0 z-50">
            <div class="flex items-center">
                <button id="sidebar-toggle"
                    class="text-[var(--admin-text-secondary)] hover:text-[var(--admin-primary-light)] focus:outline-none hidden lg:block mr-4">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <button id="sidebar-toggle-mobile"
                    class="text-[var(--admin-text-secondary)] hover:text-[var(--admin-primary-light)] focus:outline-none lg:hidden block mr-4">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <h1 id="page-title" class="text-2xl font-semibold text-[var(--admin-text-dark)]">Dashboard</h1>
            </div>

            <div class="flex items-center space-x-4">
                <div class="relative">
                    <input type="text" placeholder="Cari..."
                        class="py-2 pl-10 pr-4 rounded-full border border-[var(--admin-border-light)] focus:border-[var(--admin-primary-light)] focus:ring focus:ring-[var(--admin-primary-light)] focus:ring-opacity-50">
                    <i
                        class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-[var(--admin-text-secondary)]"></i>
                </div>
                <button
                    class="text-[var(--admin-text-secondary)] hover:text-[var(--admin-primary-light)] text-xl relative">
                    <i class="fas fa-bell"></i>
                    <span
                        class="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">3</span>
                </button>
                <div class="flex items-center cursor-pointer group">
                    <img src="https://via.placeholder.com/40" alt="Admin Avatar"
                        class="w-10 h-10 rounded-full border-2 border-[var(--admin-primary-light)]">
                    <span class="ml-2 font-medium text-[var(--admin-text-dark)] hidden md:block">Admin BJS</span>
                    <i class="fas fa-chevron-down text-xs ml-2 text-[var(--admin-text-secondary)]"></i>
                </div>
                <button class="text-[var(--admin-text-secondary)] hover:text-red-500 text-xl" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <main id="content-container" class="p-6 sm:p-8 flex-grow">
        </main>
    </div>

    <div id="add-nasabah-modal"
        class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-[1001]">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-[var(--admin-text-dark)]" id="modal-title">Tambah Nasabah Baru</h2>
            <form id="nasabah-form">
                <div class="mb-4">
                    <label for="nama_lengkap"
                        class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Nama Lengkap</label>
                    <input type="text" id="nama_lengkap" name="nama_lengkap"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-[var(--admin-primary-light)] focus:border-[var(--admin-primary-light)]"
                        required>
                </div>
                <div class="mb-4">
                    <label for="email"
                        class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Email</label>
                    <input type="email" id="email" name="email"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-[var(--admin-primary-light)] focus:border-[var(--admin-primary-light)]"
                        required>
                </div>
                <div class="mb-4">
                    <label for="nomor_hp"
                        class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Nomor HP</label>
                    <input type="text" id="nomor_hp" name="nomor_hp"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-[var(--admin-primary-light)] focus:border-[var(--admin-primary-light)]"
                        required>
                </div>
                <div class="mb-4">
                    <label for="nik"
                        class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">NIK</label>
                    <input type="text" id="nik" name="nik"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-[var(--admin-primary-light)] focus:border-[var(--admin-primary-light)]"
                        required>
                </div>
                <div class="mb-4">
                    <label for="tanggal_lahir"
                        class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Tanggal Lahir</label>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-[var(--admin-primary-light)] focus:border-[var(--admin-primary-light)]">
                </div>
                <div class="mb-4">
                    <label for="alamat"
                        class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Alamat</label>
                    <textarea id="alamat" name="alamat" rows="3"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-[var(--admin-primary-light)] focus:border-[var(--admin-primary-light)]"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="close-nasabah-modal"
                        class="px-4 py-2 bg-gray-200 text-[var(--admin-text-dark)] rounded-md hover:bg-gray-300 transition-colors">Batal</button>
                    <button type="submit"
                        class="px-4 py-2 bg-[var(--admin-primary-light)] text-white rounded-md hover:bg-green-700 transition-colors">Simpan</button>
                </div>
            </form>
        </div>
    </div>


    <script src="src/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
