<div id="detail-investasi-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-[1001]">
    <div class="bg-[var(--admin-surface-white)] p-8 rounded-lg shadow-xl w-full max-w-2xl overflow-y-auto max-h-[90vh]">
        <h2 class="text-2xl font-bold mb-6 text-[var(--admin-text-dark)]">Detail Investasi</h2>
        
        <div class="space-y-6">
            <fieldset class="p-4 border border-gray-200 rounded-md">
                <legend class="text-lg font-semibold text-[var(--admin-text-dark)] px-2">Informasi Investasi</legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">ID Investasi</label>
                        <p id="detail_id_investasi" class="text-[var(--admin-text-dark)] font-semibold"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">ID Nasabah / NIK</label>
                        <p id="detail_nasabah_id_investasi" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Nama Nasabah</label>
                        <p id="detail_nama_nasabah_investasi" class="text-[var(--admin-text-dark)] font-semibold"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Jenis Produk Investasi</label>
                        <p id="detail_jenis_investasi" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Akad Investasi</label>
                        <p id="detail_akad_investasi" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Nilai Investasi</label>
                        <p id="detail_nilai_investasi" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Jangka Waktu</label>
                        <p id="detail_jangka_waktu_investasi" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Tanggal Mulai Investasi</label>
                        <p id="detail_tanggal_mulai_investasi" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Frekuensi Bagi Hasil/Imbal Hasil</label>
                        <p id="detail_frekuensi_bagi_hasil" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Status Investasi</label>
                        <p id="detail_status_investasi" class="text-[var(--admin-text-dark)] font-semibold"></p>
                    </div>
                </div>
            </fieldset>
        </div>

        <div class="flex justify-end mt-6">
            <button type="button" id="close-detail-investasi-modal"
                class="px-4 py-2 bg-gray-200 text-[var(--admin-text-dark)] rounded-md hover:bg-gray-300 transition-colors">Tutup</button>
        </div>
    </div>
</div>
