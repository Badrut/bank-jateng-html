<div id="detail-nasabah-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-[1001]">
    <div class="bg-[var(--admin-surface-white)] p-8 rounded-lg shadow-xl w-full max-w-2xl overflow-y-auto max-h-[90vh]">
        <h2 class="text-2xl font-bold mb-6 text-[var(--admin-text-dark)]">Detail Nasabah</h2>
        
        <div class="space-y-6">
            <fieldset class="p-4 border border-gray-200 rounded-md">
                <legend class="text-lg font-semibold text-[var(--admin-text-dark)] px-2">Data Pribadi</legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Nama Lengkap Sesuai KTP</label>
                        <p id="detail_nama_lengkap" class="text-[var(--admin-text-dark)] font-semibold"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">NIK (Nomor Induk Kependudukan)</label>
                        <p id="detail_nik" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Tempat Lahir</label>
                        <p id="detail_tempat_lahir" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Tanggal Lahir</label>
                        <p id="detail_tanggal_lahir" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Jenis Kelamin</label>
                        <p id="detail_jenis_kelamin" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Status Perkawinan</label>
                        <p id="detail_status_perkawinan" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Nama Ibu Kandung</label>
                        <p id="detail_nama_ibu_kandung" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                </div>
            </fieldset>

            <fieldset class="p-4 border border-gray-200 rounded-md">
                <legend class="text-lg font-semibold text-[var(--admin-text-dark)] px-2">Data Kontak</legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Email</label>
                        <p id="detail_email" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Nomor HP</label>
                        <p id="detail_nomor_hp" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Alamat Sesuai KTP</label>
                        <p id="detail_alamat_ktp" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Alamat Domisili</label>
                        <p id="detail_alamat_domisili" class="text-[var(--admin-text-dark)] italic"></p>
                    </div>
                </div>
            </fieldset>

            <fieldset class="p-4 border border-gray-200 rounded-md">
                <legend class="text-lg font-semibold text-[var(--admin-text-dark)] px-2">Pekerjaan & Keuangan</legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Pekerjaan</label>
                        <p id="detail_pekerjaan" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Penghasilan Bulanan</label>
                        <p id="detail_penghasilan_bulanan" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Sumber Dana</label>
                        <p id="detail_sumber_dana" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Tujuan Hubungan dengan Bank</label>
                        <p id="detail_tujuan_hubungan_bank" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                </div>
            </fieldset>

            <fieldset class="p-4 border border-gray-200 rounded-md">
                <legend class="text-lg font-semibold text-[var(--admin-text-dark)] px-2">Dokumen Pendukung</legend>
                <div class="space-y-2">
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Scan KTP</label>
                        <p id="detail_upload_ktp" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Scan NPWP</label>
                        <p id="detail_upload_npwp" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[var(--admin-text-secondary)] mb-1">Scan Kartu Keluarga</label>
                        <p id="detail_upload_kk" class="text-[var(--admin-text-dark)]"></p>
                    </div>
                </div>
            </fieldset>
        </div>

        <div class="flex justify-end mt-6">
            <button type="button" id="close-detail-nasabah-modal"
                class="px-4 py-2 bg-gray-200 text-[var(--admin-text-dark)] rounded-md hover:bg-gray-300 transition-colors">Tutup</button>
        </div>
    </div>
</div>
